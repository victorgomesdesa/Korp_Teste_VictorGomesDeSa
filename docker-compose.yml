services:
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_local}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT:-8080}
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_local}
    depends_on:
      inventory-db:
        condition: service_healthy
    ports:
      - "${INVENTORY_SERVICE_PORT:-8080}:${INVENTORY_SERVICE_PORT:-8080}"

  inventory-migrate:
    image: migrate/migrate:v4.18.3
    profiles:
      - tools
    environment:
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_local}
    depends_on:
      inventory-db:
        condition: service_healthy
    volumes:
      - ./services/inventory-service/migrations:/migrations:ro

  inventory-test-db:
    image: postgres:16-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: ${INVENTORY_TEST_DB_NAME:-inventory_test_db}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_local}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

  inventory-test-runner:
    image: golang:1.25
    profiles:
      - test
    working_dir: /app
    environment:
      INVENTORY_INTEGRATION_TEST_DATABASE_URL: postgres://${INVENTORY_DB_USER:-inventory}:${INVENTORY_DB_PASSWORD:-inventory_local}@inventory-test-db:5432/${INVENTORY_TEST_DB_NAME:-inventory_test_db}?sslmode=disable
    depends_on:
      inventory-test-db:
        condition: service_healthy
    volumes:
      - ./services/inventory-service:/app

  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME:-billing_db}
      POSTGRES_USER: ${BILLING_DB_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:-billing_local}
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    environment:
      BILLING_SERVICE_PORT: ${BILLING_SERVICE_PORT:-8081}
      BILLING_DB_HOST: billing-db
      BILLING_DB_PORT: 5432
      BILLING_DB_NAME: ${BILLING_DB_NAME:-billing_db}
      BILLING_DB_USER: ${BILLING_DB_USER:-billing}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:-billing_local}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8080}
    depends_on:
      billing-db:
        condition: service_healthy
    ports:
      - "${BILLING_SERVICE_PORT:-8081}:${BILLING_SERVICE_PORT:-8081}"

volumes:
  inventory-db-data:
  billing-db-data:
